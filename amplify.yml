# AWS Amplify Hosting build config (monorepo: frontend lives in ./frontend).
# In the Amplify console set the environment variable VITE_API_BASE_URL to your
# deployed API Gateway URL (from the CDK output "ApiUrl").
version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
