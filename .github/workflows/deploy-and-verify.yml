name: Verify Remediation

# Closes the AgentSentry AI loop automatically.
#
# When a remediation pull request is MERGED, this workflow calls the public
# verification endpoint for the incident that PR was raised for. The verification
# handler re-reads the live CloudWatch metric and records RESOLVED_VERIFIED (or
# FAILED) — then comments the measured outcome back on the merged PR.
#
# No AWS credentials are required for verification: the API is a public HTTPS
# endpoint. An optional deploy job runs only if an AWS deploy role is configured.

on:
  # Automatic: fires when a PR is closed; the job below only proceeds if merged.
  pull_request:
    types: [closed]
  # Manual escape hatch for demos / re-runs.
  workflow_dispatch:
    inputs:
      incident_id:
        description: "Incident ID to verify (e.g. INC-1790566592)"
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    # Run on a real merge, or whenever triggered manually.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Resolve incident id
        id: incident
        env:
          MANUAL_ID: ${{ github.event.inputs.incident_id }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Prefer the manual input, then the PR body/title (the PR carries the
          # incident id in its summary table), then a repo variable fallback.
          ID="$MANUAL_ID"
          if [ -z "$ID" ]; then
            ID=$(printf '%s\n%s' "$PR_TITLE" "$PR_BODY" | grep -oE 'INC-[0-9]+' | head -n1 || true)
          fi
          if [ -z "$ID" ]; then ID="${{ vars.INCIDENT_ID }}"; fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          if [ -z "$ID" ]; then
            echo "No incident id found — nothing to verify."
          else
            echo "Resolved incident id: $ID"
          fi

      - name: Invoke verification loop (deploy complete)
        if: steps.incident.outputs.id != ''
        env:
          # Override with a repo variable if the API URL ever changes.
          API_BASE: ${{ vars.API_BASE_URL || 'https://6klp6vbzza.execute-api.us-east-1.amazonaws.com' }}
          INCIDENT_ID: ${{ steps.incident.outputs.id }}
        run: |
          echo "Verifying $INCIDENT_ID against $API_BASE"
          code=$(curl -sS -o response.json -w '%{http_code}' \
            -X POST "$API_BASE/api/verification/$INCIDENT_ID")
          echo "HTTP $code"
          cat response.json
          echo
          if [ "$code" != "200" ]; then
            echo "::error::Verification call failed with HTTP $code"
            exit 1
          fi
          python3 - <<'PY'
          import json, sys
          data = json.load(open("response.json"))
          status = data.get("status")
          v = data.get("verification") or {}
          print(f"::notice::Incident {data.get('id')} -> {status} "
                f"({v.get('metric_name')} observed {v.get('observed_value')})")
          if status != "RESOLVED_VERIFIED":
              print("::warning::Metric has not returned to healthy; incident not verified.")
          PY

  # Optional: redeploy infrastructure on merge. Skipped unless an AWS deploy
  # role is configured, so the workflow never fails for missing secrets.
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check for AWS deploy role
        id: gate
        run: |
          if [ -n "${{ secrets.AWS_DEPLOY_ROLE_ARN }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "AWS_DEPLOY_ROLE_ARN not set — skipping infrastructure deploy."
          fi

      - name: Checkout
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: steps.gate.outputs.enabled == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Set up Python
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CDK CLI
        if: steps.gate.outputs.enabled == 'true'
        run: npm install -g aws-cdk

      - name: Install infra dependencies
        if: steps.gate.outputs.enabled == 'true'
        working-directory: infra
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: CDK deploy
        if: steps.gate.outputs.enabled == 'true'
        working-directory: infra
        run: cdk deploy --require-approval never
